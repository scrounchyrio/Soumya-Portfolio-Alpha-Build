<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Nothing Hardware Dark Background -->
  <rect width="48" height="48" rx="10" fill="#000000" />
  <rect x="0.5" y="0.5" width="47" height="47" rx="9.5" stroke="#262626" stroke-width="1" />
  
  <!-- Subtle Inactive Matrix Background Dots -->
  <g fill="#181818">
    <!-- Grid columns 0 to 6, rows 0 to 4 -->
    <circle cx="8" cy="10" r="1.5" /><circle cx="13" cy="10" r="1.5" /><circle cx="18" cy="10" r="1.5" /><circle cx="23" cy="10" r="1.5" /><circle cx="28" cy="10" r="1.5" /><circle cx="33" cy="10" r="1.5" /><circle cx="38" cy="10" r="1.5" />
    <circle cx="8" cy="15" r="1.5" /><circle cx="13" cy="15" r="1.5" /><circle cx="18" cy="15" r="1.5" /><circle cx="23" cy="15" r="1.5" /><circle cx="28" cy="15" r="1.5" /><circle cx="33" cy="15" r="1.5" /><circle cx="38" cy="15" r="1.5" />
    <circle cx="8" cy="20" r="1.5" /><circle cx="13" cy="20" r="1.5" /><circle cx="18" cy="20" r="1.5" /><circle cx="23" cy="20" r="1.5" /><circle cx="28" cy="20" r="1.5" /><circle cx="33" cy="20" r="1.5" /><circle cx="38" cy="20" r="1.5" />
    <circle cx="8" cy="25" r="1.5" /><circle cx="13" cy="25" r="1.5" /><circle cx="18" cy="25" r="1.5" /><circle cx="23" cy="25" r="1.5" /><circle cx="28" cy="25" r="1.5" /><circle cx="33" cy="25" r="1.5" /><circle cx="38" cy="25" r="1.5" />
    <circle cx="8" cy="30" r="1.5" /><circle cx="13" cy="30" r="1.5" /><circle cx="18" cy="30" r="1.5" /><circle cx="23" cy="30" r="1.5" /><circle cx="28" cy="30" r="1.5" /><circle cx="33" cy="30" r="1.5" /><circle cx="38" cy="30" r="1.5" />
    <circle cx="8" cy="35" r="1.5" /><circle cx="13" cy="35" r="1.5" /><circle cx="18" cy="35" r="1.5" /><circle cx="23" cy="35" r="1.5" /><circle cx="28" cy="35" r="1.5" /><circle cx="33" cy="35" r="1.5" /><circle cx="38" cy="35" r="1.5" />
  </g>

  <!-- Active Glyph: 'S' (Cols 0-2) and 'M' (Cols 3-6) in Pure White -->
  <g fill="#FFFFFF">
    <!-- 'S' Dots -->
    <circle cx="13" cy="12" r="1.9" /><circle cx="18" cy="12" r="1.9" />
    <circle cx="8" cy="16" r="1.9" />
    <circle cx="13" cy="20" r="1.9" /><circle cx="18" cy="20" r="1.9" />
    <circle cx="18" cy="24" r="1.9" />
    <circle cx="8" cy="28" r="1.9" />
    <circle cx="13" cy="32" r="1.9" /><circle cx="18" cy="32" r="1.9" />

    <!-- 'M' Dots -->
    <circle cx="26" cy="12" r="1.9" /><circle cx="38" cy="12" r="1.9" />
    <circle cx="26" cy="16" r="1.9" /><circle cx="29" cy="16" r="1.9" /><circle cx="35" cy="16" r="1.9" /><circle cx="38" cy="16" r="1.9" />
    <circle cx="26" cy="20" r="1.9" /><circle cx="32" cy="20" r="1.9" /><circle cx="38" cy="20" r="1.9" />
    <circle cx="26" cy="24" r="1.9" /><circle cx="38" cy="24" r="1.9" />
    <circle cx="26" cy="28" r="1.9" /><circle cx="38" cy="28" r="1.9" />
    <circle cx="26" cy="32" r="1.9" /><circle cx="38" cy="32" r="1.9" />
  </g>

  <!-- Signature Nothing Red Accent Dot (Status / Recording indicator) -->
  <circle cx="41" cy="32" r="2.2" fill="#D71921" />
  <circle cx="41" cy="32" r="3.2" stroke="#D71921" stroke-width="0.5" opacity="0.4" />
</svg>
